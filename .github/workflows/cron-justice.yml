name: Daily Data Extraction Justice

on:
    schedule:
        - cron: "0 2 * * *"
    workflow_dispatch:

jobs:
    extract-conseil-detat:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install dependencies
              run: uv sync --dev

            - name: Run extraction for conseil d'état
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  PYTHONPATH=$(pwd) uv run justices/conseil_detat.py \
                    --user-id ${{ secrets.HF_USER_ID }}

    extract-conseil-administratif:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install dependencies
              run: uv sync --dev

            - name: Run extraction for conseil administratif d'appel
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  PYTHONPATH=$(pwd) uv run justices/conseil_administratif.py \
                    --user-id ${{ secrets.HF_USER_ID }}

    extract-tribunal:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install dependencies
              run: uv sync --dev

            - name: Run extraction for tribunal administratif
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  PYTHONPATH=$(pwd) uv run justices/tribunal_adminstratif.py \
                    --user-id ${{ secrets.HF_USER_ID }}
