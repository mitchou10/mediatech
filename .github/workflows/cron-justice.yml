name: Daily Data Extraction Justice

on:
    schedule:
        - cron: "0 2 * * *"
    workflow_dispatch:
        inputs:
            days_ago:
                description: "Number of days ago to start from (default: 1 for yesterday)"
                required: false
                default: "1"
                type: string

jobs:
    extract-conseil-detat:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.13"

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Install dependencies
              run: uv sync --dev
            - name: Run extraction for conseil d'état
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  DAYS_AGO=${{ github.event.inputs.days_ago || '1' }}
                  PYTHONPATH=$(pwd) uv run justices/conseil_detat.py \
                    --user-id ${{ secrets.HF_USER_ID }} \
                    --start_date $(date -d "$DAYS_AGO days ago" +%Y-%m-%d) \
                    --end_date $(date +%Y-%m-%d)

